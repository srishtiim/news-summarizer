<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Summarizer - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>

<body>

    <div class="split-screen">
        <!-- Left Side: Login Form -->
        <div class="left-panel">
            <div class="login-container">
                <div class="logo-area">
                    <h1>News Summarizer</h1>
                    <p>Welcome back! Please login to your account.</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="name@example.com">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>

                    <div class="form-actions">
                        <label class="checkbox-container">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button id="openSignupBtn" class="btn-secondary">Create an Account</button>
            </div>
        </div>

        <!-- Right Side: Preview & Animations -->
        <div class="right-panel">
            <div class="preview-content">
                <h2>Summarize News in Seconds</h2>
                <div class="feature-list">
                    <div class="feature-item">
                        <span class="icon">⚡</span>
                        <p>Instant AI-powered summaries</p>
                    </div>
                    <div class="feature-item">
                        <span class="icon">📰</span>
                        <p>Curated daily news feed</p>
                    </div>
                    <div class="feature-item">
                        <span class="icon">🧠</span>
                        <p>Smart quizzes & key insights</p>
                    </div>
                </div>

                <!-- Abstract Animation Area -->
                <div class="animation-container">
                    <lottie-player src="https://assets2.lottiefiles.com/packages/lf20_M9p23l.json"
                        background="transparent" speed="1" style="width: 300px; height: 300px;" loop
                        autoplay></lottie-player>
                </div>
            </div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Create Account</h2>
            <form id="signupForm" class="auth-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" required>
                </div>
                <div class="input-group">
                    <label>Username (Optional)</label>
                    <input type="text" id="signup-username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required minlength="8">
                    <div class="password-strength" id="password-strength"></div>
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>
            </form>
            </form>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="resetModal" class="modal">
        <div class="modal-content">
            <span class="close-reset">&times;</span>
            <h2>Reset Password</h2>
            <form id="resetForm" class="auth-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="reset-email" required placeholder="Enter used email">
                </div>
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="reset-password" required minlength="8" placeholder="new password">
                </div>
                <button type="submit" class="btn-primary">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/auth';
        const STREAMLIT_URL = 'http://localhost:8501';

        // elements
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const modal = document.getElementById('signupModal');
        const resetModal = document.getElementById('resetModal');
        const openSignupBtn = document.getElementById('openSignupBtn');
        const forgotBtn = document.querySelector('.forgot-password');
        const closeModal = document.querySelector('.close-modal');
        const closeReset = document.querySelector('.close-reset');

        // Modal Logic
        openSignupBtn.onclick = () => modal.style.display = "flex";
        closeModal.onclick = () => modal.style.display = "none";

        forgotBtn.onclick = (e) => {
            e.preventDefault();
            resetModal.style.display = "flex";
        }
        closeReset.onclick = () => resetModal.style.display = "none";

        window.onclick = (event) => {
            if (event.target == modal) modal.style.display = "none";
            if (event.target == resetModal) resetModal.style.display = "none";
        }

        // Login Handler
        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    // Redirect to Streamlit with token
                    window.location.href = `${STREAMLIT_URL}?token=${data.token}`;
                } else {
                    alert(data.message || 'Login failed');
                }
            } catch (err) {
                console.error(err);
                alert('Network error');
            }
        };

        // Signup Handler
        signupForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const username = document.getElementById('signup-username').value;

            try {
                const res = await fetch(`${API_BASE}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username })
                });
                const data = await res.json();

                if (data.success) {
                    alert('Account created! Logging you in...');
                    window.location.href = `${STREAMLIT_URL}?token=${data.token}`;
                } else {
                    alert(data.message || 'Signup failed');
                }
            } catch (err) {
                console.error(err);
                alert('Network error');
            }
        };

        // Reset Password Handler
        const resetForm = document.getElementById('resetForm');
        resetForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const new_password = document.getElementById('reset-password').value;

            try {
                const res = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, new_password })
                });
                const data = await res.json();

                if (data.success) {
                    alert('Password updated! Please login with your new password.');
                    resetModal.style.display = "none";
                } else {
                    alert(data.message || 'Reset failed');
                }
            } catch (err) {
                console.error(err);
                alert('Network error');
            }
        };

    </script>
</body>

</html>
